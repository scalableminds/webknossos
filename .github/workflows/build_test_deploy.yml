name: CI Pipeline

on:
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch: {}

env:
  USER_UID: 1001
  USER_GID: 1001
  POSTGRES_URL: "jdbc:postgresql://localhost:5434/webknossos"
  POSTGRES_USER: "webknossos_user"
  POSTGRES_PASSWORD: "secret_password"
  CERTIFICATE: ${{ secrets.CERTIFICATE_FOR_CI_ONLY }}
  CERTIFICATE_PUBLIC_KEY: ${{ secrets.CERTIFICATE_PUBLIC_KEY }}
  # Compile with -Werror in all sbt jobs (see build.sbt). Identical scalacOptions are required so that
  # the jobs can share zinc's incremental compile cache.
  WK_FAIL_ON_WARNING: "true"

jobs:
  frontend-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Lint frontend code and check formatting
        run: yarn run check-frontend-ci
      - name: Typecheck frontend code
        run: yarn typecheck
      - name: Check for cyclic dependencies in frontend
        run: yarn check-cyclic-dependencies
      - name: Run frontend tests
        run: yarn run vitest run --config vitest_spec.config.ts --coverage.enabled true --silent=passed-only
      - name:
          Download Coverage Artifacts
          # Can not use actions/download-artifact@v4 because it does not support downloading artifacts from other GA runs
        id: coverage-baseline
        continue-on-error: true # the GitHub API intermittently fails to serve the artifact, which must not fail the build
        run: |
          gh_last_success_run_id=$(gh run list --workflow "CI Pipeline" --json conclusion,headBranch,databaseId --branch master --jq 'first(.[] | select(.conclusion | contains("success"))) | .databaseId')
          [ -z "$gh_last_success_run_id" ] && echo "No successful run found" && exit 1 || true
          gh run download $gh_last_success_run_id -n $ARTIFACT_NAME -D $OUTPUT_DIR
          echo "baseline=$OUTPUT_DIR/coverage-summary.json" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_NAME: vitest-coverage-master
          OUTPUT_DIR: coverage-master
      - name: "Report Coverage"
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          comment-on: none # alternative: pr
          # Empty if no baseline could be downloaded, in which case the action skips the comparison
          json-summary-compare-path: ${{ steps.coverage-baseline.outputs.baseline }}
      - name: "Upload Coverage"
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: vitest-coverage-master
          path: coverage

  # Separate job, so that formatting/linting runs in parallel to compiling and testing.
  # scalafmt and the (syntactic) scalafix rules do not need compiled code.
  backend-lint:
    runs-on: ubuntu-22.04
    if: github.ref != 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
          persist-credentials: false

      # No `cache: sbt` here: this job only resolves the build's plugins. It would save its incomplete
      # dependency cache first, under the same key the compiling jobs need to save the full one.
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: sbt/setup-sbt@v1

      - name: Check backend formatting and lint
        run: sbt "scalafmtCheck; Test/scalafmtCheck; util/scalafmtCheck; webknossosTracingstore/scalafmtCheck; webknossosDatastore/scalafmtCheck; scalafix --check; Test/scalafix --check; util/scalafix --check; webknossosTracingstore/scalafix --check; webknossosDatastore/scalafix --check"

  backend-tests:
    runs-on: ubuntu-22.04
    if: github.ref != 'refs/heads/master'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1

      # Incremental compile cache. Falls back to the latest master build, so that a branch's first push
      # only recompiles what changed relative to master.
      - name: Restore incremental compile cache
        uses: actions/cache@v6
        with:
          path: |
            target
            !target/universal
            project/target
            project/project/target
            util/target
            webknossos-datastore/target
            webknossos-tracingstore/target
            webknossos-jni/target
            webknossos-slick-codegen/target
            !target/web
            !**/target/**/*.jar
            !**/target/global-logging
          key: zinc-test-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            zinc-test-${{ github.ref_name }}-
            zinc-build-${{ github.ref_name }}-
            zinc-build-master-

      - name: Start Docker Services Postgres, Redis
        run: docker compose --file .github/docker-compose.yml up -d postgres redis

      - name: Install frontend and system dependencies
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq libdraco-dev) > "$RUNNER_TEMP/apt.log" 2>&1 &
          apt_pid=$!
          yarn install --immutable
          wait $apt_pid || { cat "$RUNNER_TEMP/apt.log"; exit 1; }

      - name: Assert unique evolution numbers
        run: tools/postgres/dbtool.js assert-unique-evolution-numbers
      - name: Assert schema.sql and evolutions are equal
        run: tools/postgres/dbtool.js check-evolutions-schema
      - name: Assert that all migrations are mentioned in one migration guide and that they have a reversion counterpart.
        run: tools/assert-complete-migrations.sh
      - name: Assert no 'SELECT *'  are present in scala files
        run: tools/assert-no-select-asterisk-present.sh
      - name: Run backend unit tests
        run: sbt --client -v "testOnly backend.*"

      - name: Start Fossildb for e2e tests
        run: docker compose --file .github/docker-compose.yml up -d fossildb
      - name: Prepare binaryData folder for e2e tests
        run: mkdir -p binaryData/Organization_X && chmod 777 binaryData/Organization_X
      - name: Run end-to-end tests
        uses: ./.github/actions/retry
        with:
          run: |
            sbt --client "testOnly e2e.* -- -Dtracingstore.fossildb.address=localhost -Dtracingstore.redis.address=localhost -Ddatastore.redis.address=localhost -Ddatastore.watchFileSystem.enabled=false"
          retries: 3
      - name: Assert non-empty e2e files
        run: bash -c '[ $(ls -1 frontend/javascripts/test/snapshots/type_check | wc -l) -gt 0 ]'
      - name: Check response types of e2e tests
        run: yarn tsc

  build-smoketest-push:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 5
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      # Incremental compile cache. Release (tag) builds always compile from scratch.
      - name: Restore incremental compile cache
        if: github.ref_type != 'tag'
        uses: actions/cache@v6
        with:
          path: |
            target
            !target/universal
            project/target
            project/project/target
            util/target
            webknossos-datastore/target
            webknossos-tracingstore/target
            webknossos-jni/target
            webknossos-slick-codegen/target
            !target/web
            !**/target/**/*.jar
            !**/target/global-logging
          key: zinc-build-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            zinc-build-${{ github.ref_name }}-
            zinc-build-master-

      - name: Start Docker Services Postgres, Redis
        run: docker compose --file .github/docker-compose.yml up -d postgres redis

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: "Custom environment variables (Not Pull Request)"
        run: |
          CI_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          NORMALIZED_BRANCH=${CI_BRANCH//[\/-]/_}
          DOCKER_TAG="${NORMALIZED_BRANCH}__${GITHUB_RUN_ID}"
          echo "DOCKER_TAG=$DOCKER_TAG" | tee -a "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" == "branch" ]; then
            echo "NORMALIZED_BRANCH=$NORMALIZED_BRANCH" | tee -a "$GITHUB_ENV"
          else
            CI_TAG=$GITHUB_REF_NAME
            echo "CI_TAG=$CI_TAG" | tee -a "$GITHUB_ENV"
            echo "NORMALIZED_BRANCH=$CI_TAG" | tee -a "$GITHUB_ENV"
          fi
          echo "CI_BUILD_NUM=$GITHUB_RUN_ID" | tee -a "$GITHUB_ENV"

      - name: Prepare Dependency Folders
        run: mkdir -p project/target target ~/.ivy2 ~/.cache/coursier

      - name: Install frontend and system dependencies
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq libdraco-dev) > "$RUNNER_TEMP/apt.log" 2>&1 &
          apt_pid=$!
          yarn install --immutable
          wait $apt_pid || { cat "$RUNNER_TEMP/apt.log"; exit 1; }
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"

      # The frontend build is only needed by `stage`, not by `compile`, so both run concurrently.
      - name: Build frontend (vite, docs) and compile webknossos, datastore and tracingstore (sbt)
        run: |
          (yarn build && yarn run docs --project-version "$WK_VERSION") > "$RUNNER_TEMP/frontend-build.log" 2>&1 &
          frontend_pid=$!
          sbt --client compile
          frontend_status=0
          wait $frontend_pid || frontend_status=$?
          echo "::group::Frontend build output"
          cat "$RUNNER_TEMP/frontend-build.log"
          echo "::endgroup::"
          exit $frontend_status
        env:
          WK_VERSION: ${{ github.run_id }}

      - name: Stage webknossos, datastore and tracingstore (sbt)
        run: |
          sbt --client "stage; webknossosDatastore/stage; webknossosTracingstore/stage"
          sbt --client shutdown
      - name: Checksum App Dirs
        run: find app webknossos-datastore/app webknossos-tracingstore/app -type f -exec md5sum {} \; | sort -k 2 | md5sum > app_checksum.txt

      - name: Build webknossos docker image
        uses: docker/build-push-action@v7
        with:
          file: .github/Dockerfile.webknossos
          context: .
          push: false
          tags: |
            scalableminds/webknossos:${{ env.NORMALIZED_BRANCH }}
            scalableminds/webknossos:${{ env.DOCKER_TAG }}
          outputs: |
            type=image
      - name: Build webknossos-datastore docker image
        uses: docker/build-push-action@v7
        with:
          file: .github/Dockerfile.datastore
          context: webknossos-datastore
          push: false
          tags: |
            scalableminds/webknossos-datastore:${{ env.NORMALIZED_BRANCH }}
            scalableminds/webknossos-datastore:${{ env.DOCKER_TAG }}
          outputs: |
            type=image
      - name: Build webknossos-tracingstore docker image
        uses: docker/build-push-action@v7
        with:
          file: .github/Dockerfile.tracingstore
          context: webknossos-tracingstore
          push: false
          tags: |
            scalableminds/webknossos-tracingstore:${{ env.NORMALIZED_BRANCH }}
            scalableminds/webknossos-tracingstore:${{ env.DOCKER_TAG }}
          outputs: |
            type=image

      - name: Start webknossos, datastore and tracingstore via docker for smoke test
        run: |
          set -e
          docker compose --file .github/docker-compose.yml up -d \
            webknossos \
            webknossos-datastore \
            webknossos-tracingstore
      - name: Run webknossos smoke test
        uses: ./.github/actions/retry
        with:
          run: curl -v --fail-with-body "http://localhost:9000/api/health"
          retries: 20
          retry_delay_seconds: 5
      - name: Run webknossos-datastore smoke test
        uses: ./.github/actions/retry
        with:
          run: curl -v --fail-with-body "http://localhost:9090/data/health"
          retries: 20
          retry_delay_seconds: 5
      - name: Run webknossos-tracingstore smoke test
        uses: ./.github/actions/retry
        with:
          run: curl -v --fail-with-body "http://localhost:9050/tracings/health"
          retries: 20
          retry_delay_seconds: 5
      - name: Stop webknossos, datastore and tracingstore
        run: docker compose --file .github/docker-compose.yml down --volumes --remove-orphans

      - uses: docker/login-action@v4
        if: ${{ github.actor != 'dependabot[bot]' }}
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Push webknossos, datastore and tracingstore images
        if: ${{ ! startsWith(github.ref, 'refs/tags/') && github.actor != 'dependabot[bot]' }}
        uses: ./.github/actions/retry
        with:
          # Push all images in parallel. Retry wraps all, so successes may be retried too if one fails. That’s ok, it’s idempotent.
          run: |
            set -o pipefail
            pids=()
            for image in webknossos webknossos-datastore webknossos-tracingstore; do
              # with sed, prepend image name for clean logging despite concurrency
              docker push "scalableminds/$image:${{ env.DOCKER_TAG }}" 2>&1 | sed -u "s/^/[$image] /" &
              pids+=($!)
            done
            fail=0
            for pid in "${pids[@]}"; do wait "$pid" || fail=1; done
            exit $fail
          retries: 5
          retry_delay_seconds: 10
      - name: Push normalized webknossos, datastore and tracingstore images
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: ./.github/actions/retry
        with:
          # Push all images in parallel. Retry wraps all, so successes may be retried too if one fails. That’s ok, it’s idempotent.
          run: |
            set -o pipefail
            pids=()
            for image in webknossos webknossos-datastore webknossos-tracingstore; do
              # with sed, prepend image name for clean logging despite concurrency
              docker push "scalableminds/$image:${{ env.NORMALIZED_BRANCH }}" 2>&1 | sed -u "s/^/[$image] /" &
              pids+=($!)
            done
            fail=0
            for pid in "${pids[@]}"; do wait "$pid" || fail=1; done
            exit $fail
          retries: 5
          retry_delay_seconds: 10
      - name: Slack Notification
        if: github.ref == 'refs/heads/master'
        run: .github/slack-notification.sh
        env:
          SLACK_NOTIFY_TOKEN: ${{ secrets.SLACK_NOTIFY_TOKEN }}
