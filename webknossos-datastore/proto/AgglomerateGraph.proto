syntax = "proto2";

package com.scalableminds.webknossos.datastore;

import "geometry.proto";

message AgglomerateEdge { // Note that the edges are stored directed but semantically undirected. When testing for an edge, check both directions.
  required uint64 source = 1;
  required uint64 target = 2;
}

message AgglomerateGraph {
  repeated uint64 segments = 1;
  repeated AgglomerateEdge edges = 2;
  repeated Vec3IntProto positions = 3;
  repeated float affinities = 4;
}

// Difference of an agglomerate to the reference agglomerate that contains one of its segments
// (see AgglomerateGraphDiff.scala).
message AgglomerateGraphDiffProto {
  required uint64 referenceAgglomerateId = 1;
  // Three entries (x, y, z) per segment that is an endpoint of an added or removed edge
  repeated int32 positions = 2 [packed = true];
  // Two entries per edge, each the index of an endpoint (in the order of positions)
  repeated int32 addedEdges = 3 [packed = true];
  repeated int32 removedEdges = 4 [packed = true];
}
