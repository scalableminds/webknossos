[package]
name = "webknossos-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "AGPL-3.0-only"
description = "Incremental Rust implementation of the WEBKNOSSOS application backend"

[dependencies]
axum = { version = "0.8", features = ["json", "query", "tokio", "http1", "multipart"] }
base64 = "0.22"
bcrypt = "0.17"
chrono = { version = "0.4", features = ["serde"] }
getrandom = "0.4"
hmac = "0.12"
futures-util = "0.3"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
serde_urlencoded = "0.7"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "derive"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["request-id", "trace", "timeout", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
prost = "0.14"
quick-xml = "0.42.0"
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname", "ring"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
prost-build = "0.14"
protox = "0.10"
