<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="commit-hash" content="" />
  <meta name="selected-theme" content="" />
  <!-- INJECT_THEME_CSS -->
  <title>Loading | WEBKNOSSOS</title>
  <!-- INJECT_OPENGRAPH_METADATA -->
  <!-- INJECT_WKORG_METADATA -->
  <link rel="shortcut icon" type="image/png" href="frontend/assets/images/favicon.png" />
  <!-- INJECT_AIRBRAKE_CONFIG -->
  <!-- Shown until React mounts into #main-container and replaces it, e.g. while vite is still compiling. -->
  <style>
    .boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      color: #888;
    }

    .boot-loader-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(136, 136, 136, 0.25);
      border-top-color: #5660ff;
      border-radius: 50%;
      animation: boot-loader-spin 0.8s linear infinite;
    }

    @keyframes boot-loader-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script src="frontend/javascripts/main.tsx" type="module"></script>
</head>

<body>
  <main id="main-container">
    <div class="boot-loader">
      <div class="boot-loader-spinner"></div>
      Loading WEBKNOSSOS&hellip;
    </div>
  </main>
</body>

</html>
