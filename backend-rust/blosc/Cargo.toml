[package]
name = "webknossos-blosc"
description = "Safe wrapper around c-blosc 1.21.6 (blosc-src), called like blosc-java's JNI binding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
blosc-src = { version = "=0.3.8", features = ["lz4", "zlib", "zstd"] }

# Not the workspace lints: they forbid `unsafe_code`, which the FFI calls need. This crate is the
# only place that calls into c-blosc; its API is safe.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
