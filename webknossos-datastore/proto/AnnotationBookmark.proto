syntax = "proto2";

package com.scalableminds.webknossos.datastore;

import "geometry.proto";
import "MetadataEntry.proto";

// Bookmarks are stored separately from the AnnotationProto, which only holds their ids.
message AnnotationBookmarkProto {
  required int32 id = 1;
  required int64 created = 2;
  optional string name = 3;
  optional string description = 4;
  required AnnotationBookmarkStateProto state = 5;
  required int64 createdAtVersion = 6; // annotation version that added the bookmark
  repeated MetadataEntryProto metadata = 7;
  required int64 thumbnailVersion = 8; // annotation version that stored the current thumbnails
  // Thumbnails are stored in the annotationBookmarkThumbnails column family.
}

message AnnotationBookmarksProto {
  repeated AnnotationBookmarkProto bookmarks = 1;
}

// Mirrors the view state of a sharing link (UrlManagerState in the frontend).
message AnnotationBookmarkStateProto {
  // Nested so that the enum values don't clash with others in the package.
  enum ViewModeProto {
    orthogonal = 1;
    flight = 2;
  }
  enum MappingTypeProto {
    JSON = 1;
    AGGLOMERATE = 2;
  }

  required Vec3IntProto position = 1;
  required ViewModeProto mode = 2;
  required double zoomStep = 3;
  required Vec3DoubleProto rotation = 4;
  optional int32 activeNodeId = 5;
  repeated AdditionalCoordinateProto additionalCoordinates = 6;
  optional string nativelyRenderedLayerName = 7; // layer name or tracingId, unset renders all layers with their transforms
  required double clippingDistance = 8;
  required bool clipSkeletonToCurrentSection = 9;
  optional BookmarkTdCameraProto tdCamera = 10;
  optional bool showSkeletons = 11; // unset if the annotation has no skeleton
  repeated BookmarkLayerStateProto layers = 12;
}

message BookmarkTdCameraProto {
  required Vec3DoubleProto position = 1;
  required Vec3DoubleProto up = 2;
  required double left = 3;
  required double right = 4;
  required double top = 5;
  required double bottom = 6;
}

message BookmarkLayerStateProto {
  required string layerName = 1; // dataset layer name or tracingId of an annotation layer
  optional bool isDisabled = 2;
  optional Vec2DoubleProto intensityRange = 3;
  optional Vec3DoubleProto color = 4;
  optional bool isInverted = 5;
  optional double gammaCorrectionValue = 6;
  optional BookmarkMappingProto mapping = 7; // unset if no mapping is enabled
  optional string meshFileName = 8;
  repeated BookmarkMeshProto meshes = 9; // only visible meshes
}

message BookmarkMappingProto {
  required string mappingName = 1;
  required AnnotationBookmarkStateProto.MappingTypeProto mappingType = 2;
}

message BookmarkMeshProto {
  required uint64 segmentId = 1;
  required Vec3IntProto seedPosition = 2;
  required bool isPrecomputed = 3;
  optional string meshFileName = 4; // precomputed meshes only
  optional string mappingName = 5; // ad-hoc meshes only
  optional AnnotationBookmarkStateProto.MappingTypeProto mappingType = 6; // ad-hoc meshes only
}
